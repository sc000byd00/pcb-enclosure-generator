[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-enclosure-generator"
version = "0.1.0"
description = "Parametric 3D-printable enclosures for PCBs: snap-fit lid, light pipes, button, design checks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andreas Enns" }]
requires-python = ">=3.10"
dependencies = ["build123d==0.13.0", "pyyaml>=6"]

[project.optional-dependencies]
drawing = ["matplotlib>=3.8"]
test = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
enclosure = "enclosure.cli:main"

[tool.setuptools]
packages = ["enclosure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
