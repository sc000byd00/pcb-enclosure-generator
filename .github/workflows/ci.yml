name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Tests
        run: pytest -q
      - name: Build the examples
        run: enclosure build examples/*.yaml -o out --drawing
      - name: Build the KiCad examples
        run: |
          enclosure from-kicad examples/kicad/esp32-node.kicad_pcb -o out
          enclosure from-kicad examples/kicad/gateway.kicad_pcb -o out
      - uses: actions/upload-artifact@v4
        with:
          name: example-enclosures
          path: out/
